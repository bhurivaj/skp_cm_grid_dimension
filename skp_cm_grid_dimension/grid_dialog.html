<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Dimension Tool</title>
  <link rel="stylesheet" href="grid_dialog.css">
  <link rel="stylesheet" href="grid_parts.css">
</head>

<body>
  <h1>⊞ Grid Dimension Tool</h1>

  <!-- Mode Toggle -->
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="uniform" onclick="setMode('uniform')">Uniform</button>
    <button class="mode-btn" data-mode="variable" onclick="setMode('variable')">Variable (ลากปรับ)</button>
  </div>

  <!-- Unit Selector -->
  <div class="unit-selector">
    <button class="unit-btn active" data-unit="mm" onclick="setUnit('mm')">mm</button>
    <button class="unit-btn" data-unit="cm" onclick="setUnit('cm')">cm</button>
    <button class="unit-btn" data-unit="m" onclick="setUnit('m')">m</button>
  </div>

  <!-- Grid Preview (Variable Mode) -->
  <div class="preview-container" id="previewSection">
    <div class="preview-header">
      <div class="preview-title">Preview</div>
      <div class="preview-info" id="previewInfo">ลากเส้นเพื่อปรับขนาด</div>
    </div>
    <canvas id="gridCanvas"></canvas>
    <div class="total-dimensions" id="totalDimensions">
      Total: 5000 × 5000 mm
    </div>
  </div>

  <!-- Grid Size Section (Uniform Mode) -->
  <div class="section" id="uniformSection">
    <div class="section-title">ขนาด Grid</div>
    <div class="row">
      <div class="form-group">
        <label>คอลัมน์ (X)</label>
        <input type="number" id="columns" min="1" value="5" placeholder="5" onchange="onGridSizeChange()">
      </div>
      <div class="form-group">
        <label>แถว (Y)</label>
        <input type="number" id="rows" min="1" value="5" placeholder="5" onchange="onGridSizeChange()">
      </div>
    </div>
    <div class="row" id="uniformSpacingRow">
      <div class="form-group">
        <label>ความกว้าง (X) <span id="unit-x">mm</span></label>
        <input type="number" id="spacingX" min="0.1" step="0.1" value="1000" placeholder="1000"
          onchange="onSpacingChange()">
      </div>
      <div class="form-group">
        <label>ความลึก (Y) <span id="unit-y">mm</span></label>
        <input type="number" id="spacingY" min="0.1" step="0.1" value="1000" placeholder="1000"
          onchange="onSpacingChange()">
      </div>
    </div>
  </div>

  <!-- Variable Spacing Section -->
  <div class="section hidden" id="variableSection">
    <div class="section-title">ระยะห่างแต่ละช่อง</div>
    <div class="row">
      <div>
        <label>คอลัมน์ (X) <span id="unit-col">mm</span></label>
        <div class="spacing-list" id="columnSpacings"></div>
      </div>
      <div>
        <label>แถว (Y) <span id="unit-row">mm</span></label>
        <div class="spacing-list" id="rowSpacings"></div>
      </div>
    </div>
  </div>

  <!-- Label Settings Section -->
  <div class="section">
    <div class="section-title">การตั้งค่า Label</div>
    <div class="row">
      <div class="form-group">
        <label>ระยะ Offset <span id="unit-offset">mm</span></label>
        <input type="number" id="labelOffset" min="0" step="any" value="300" placeholder="300">
      </div>
      <div class="form-group">
        <label>ขนาดตัวอักษร <span id="unit-size">mm</span></label>
        <input type="number" id="labelSize" min="0" step="any" value="300" placeholder="300">
      </div>
    </div>
  </div>

  <!-- Height Levels Section -->
  <div class="section">
    <div class="section-title">ระดับความสูง (Z) <span class="info-icon" title="เพิ่มหลายระดับความสูงได้">?</span></div>
    <div class="height-levels-container" id="heightLevels">
      <div class="height-level" data-level="1">
        <span class="level-label">ระดับ 1</span>
        <input type="number" min="0" step="0.1" value="0" placeholder="0">
        <button class="btn-remove" onclick="removeLevel(this)" title="ลบ">✕</button>
      </div>
      <div class="height-level" data-level="2">
        <span class="level-label">ระดับ 2</span>
        <input type="number" min="0" step="0.1" value="3000" placeholder="3000">
        <button class="btn-remove" onclick="removeLevel(this)" title="ลบ">✕</button>
      </div>
    </div>
    <button class="btn-add" onclick="addLevel()">+ เพิ่มระดับ</button>
  </div>

  <!-- Action Buttons -->
  <div class="button-group">
    <button class="btn btn-secondary" onclick="cancel()">ยกเลิก</button>
    <button class="btn btn-primary" id="generateBtn" onclick="generateGrid()">สร้าง Grid</button>
  </div>

  <script src="grid_canvas.js"></script>
  <script src="grid_levels.js"></script>
  <script src="grid_edit.js"></script>
  <script src="grid_dialog.js"></script>
</body>

</html>
